[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shorteth"
version = "1.0.0"
description = "Independent ETH short strategy with inherited S300 Bitget execution"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "fastapi>=0.110,<1", "uvicorn>=0.30,<1", "cryptography>=43,<50"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
backtest = ["numpy>=2", "pandas>=2", "numba>=0.61"]

[project.scripts]
shorteth = "shorteth.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["shorteth*"]
exclude = ["research*", "tests*"]

[tool.setuptools.package-data]
shorteth = ["static/*.html", "static/*.csv"]
